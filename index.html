<!doctype html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Verminslayer</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Digital prototype and playtest engine for the Verminslayer board game"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8b1e1e" />
    <link rel="canonical" href="https://verminslayer.facerix.com/" />
    <meta property="og:title" content="Verminslayer" />
    <meta
      property="og:description"
      content="Digital prototype and playtest engine for the Verminslayer board game"
    />
    <meta property="og:url" content="https://verminslayer.facerix.com/" />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Language" content="en" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body class="u-fill-height">
    <header id="main-head">
      <a class="header-identity" href="/">
        <img id="logo" src="/favicon.svg" alt="" />
        <h1>Verminslayer</h1>
      </a>
      <button id="quit-game" type="button" hidden>Quit game</button>
    </header>
    <main id="title-screen" class="title-screen">
      <div class="title-card">
        <p class="eyebrow">Verminslayer</p>
        <h2>Descend into the dark.</h2>
        <p>A cooperative dungeon crawl against the Skaven horde.</p>
        <button id="select-mission" type="button">Select your mission</button>
        <div id="mission-list" class="mission-list" hidden></div>
      </div>
    </main>
    <main id="game-shell" class="game-shell" hidden>
      <section class="board-panel" aria-labelledby="mission-title">
        <div class="mission-heading">
          <p class="eyebrow">Mission</p>
          <h2 id="mission-title"></h2>
        </div>
        <toast-message id="event-highlight"></toast-message>
        <div class="board-stage"><game-board></game-board></div>
      </section>

      <aside class="mission-panel" aria-label="Game controls" tabindex="0">
        <game-setup></game-setup>
      </aside>
    </main>

    <footer id="main-foot">A&nbsp;<a href="/about.html">Facerix</a>&nbsp;creation</footer>

    <update-notification></update-notification>
    <confirmation-modal></confirmation-modal>
  </body>
  <script src="/index.js" type="module"></script>
</html>
